theme: flame
pack: ai-agent
product:
  name: Luffy
  tagline: Comment-triggered PR review agent
  one_liner: Hermes Agent + OpenRouter + growing hub memory + redacted run traces.
repo:
  owner: Mr-Ashish
  name: luffy-pr-review-agent
  default_branch: main
  private: true
badges:
  - type: workflow
    workflow: luffy-pr-review.yml
    label: PR Review
    message: comment · Actions
    color: 2ea44f
  - type: workflow
    workflow: ingest-luffy-run.yml
    label: Hub memory
    message: central ingest
    color: C41E3A
  - type: static
    label: trigger
    message: "@luffy review this pr"
    color: FF6B2C
    logo: github
  - type: static
    label: model
    message: anthropic/claude-opus-5
    color: 0B0F19
  - type: static
    label: provider
    message: OpenRouter
    color: C41E3A
  - type: last-commit
    label: branch
    message: main
    color: 0B0F19
  - type: license
    message: MIT
hero:
  mark: assets/luffy-artifact-orbital-core.png
  show_mark: true
  mark_width: 360
sections:
  - hero
  - badges
  - why
  - trigger
  - architecture
  - e2e
  - agentic_loop
  - custom_showcase
  - setup
  - local
  - traces
  - memory
  - layout
  - docs
  - limits
  - footer
content:
  why: "Most AI PR bots are stateless chat on a diff. Luffy is a review control plane: explicit trigger, bounded
    context (sparse checkout + capped diff), Hermes via OpenRouter, durable hub memory so the next review on
    the same repo is smarter, and redacted traces as Actions artifacts for audit."
  trigger:
    - "@luffy review this pr"
    - "@luffy review"
  trigger_note: "Also: **Actions → Luffy PR Review → Run workflow** (PR number)."
  architecture_mermaid: diagrams/architecture.mmd
  architecture_note: Install Luffy on each **target** repo; this hub stores memory under `memory/repos/`.
  e2e_mermaid: diagrams/e2e.mmd
  pipeline_mermaid: diagrams/pipeline.mmd
  setup_steps:
    - Copy `agent/`, `scripts/`, and `.github/workflows/luffy-pr-review.yml` onto the **default branch**
    - Add secret `OPENROUTER_API_KEY`
    - Add secret `LUFFY_HUB_TOKEN` (PAT that can push to this hub)
    - "Optional vars: `LUFFY_MODEL`, `LUFFY_HUB_REPO`, `LUFFY_HUB_MODE`"
    - "Comment on a PR: `@luffy review this pr`"
  local_commands: |-
    # .env has OPENROUTER_API_KEY (gitignored)
    ./scripts/review-local.sh owner/repo 123
    POST_COMMENT=1 ./scripts/review-local.sh owner/repo 123
  traces: Each run packages a redacted trace and uploads Actions artifacts.
  traces_layout: |-
    .luffy-out/traces/pr{N}-run{id}-a{attempt}/
      meta.json  prompt.md  context.md  pr.diff
      review.raw.md  review.md  hermes.stderr  timings.json
  traces_download: gh run download <run-id> -R owner/repo -n luffy-trace-pr1-run<run-id>
  memory: After each run, the target publishes into **this** hub repo so memory grows across reviews.
  memory_layout: |-
    memory/repos/{owner}--{repo}/
      MEMORY.md
      latest.json
      runs/{trace_id}/meta.json|review.md|summary.md
  layout: |-
    agent/          SOUL, prompts, Hermes config
    scripts/        assemble → hermes → normalize → hub
    memory/         central per-repo MEMORY (hub)
    readme-kit/     compile README from theme + pack + config
    assets/         brand mark + favicon
    .github/workflows/
  docs_links:
    - title: "Blog: Building Luffy (agentic PR review)"
      path: docs/blog/building-luffy-agentic-pr-review.md
    - title: Architecture
      path: docs/ARCHITECTURE.md
    - title: Operations
      path: docs/OPERATIONS.md
    - title: ROI fixes
      path: docs/ROI-FIXES.md
    - title: README branding ecosystem
      path: docs/README-BRANDING-ECOSYSTEM.md
    - title: readme-kit MVP
      path: docs/README-KIT-MVP.md
    - title: Brand banner options (pick one)
      path: assets/brand-options/README.md
  limits:
    - PR comment reviews only (not inline threads yet)
    - Diffs truncated at MAX_DIFF_BYTES
    - Default OpenRouter model is paid (anthropic/claude-opus-5; override with LUFFY_MODEL)
    - Install on each target repo — not a global bot for arbitrary public repos
    - Hermes tool-loop traces not fully exported yet (final review + outer pipeline are)
  footer: Luffy · Hermes Agent · OpenRouter · memory-backed review · generated by readme-kit
  custom_showcase_title: E2E showcase (live · Opus 5 agentic loop)
  custom_showcase: >
    Full captured run on [odoo/odoo#271153](https://github.com/odoo/odoo/issues/271153) →
    [Mr-Ashish/odoo#3](https://github.com/Mr-Ashish/odoo/pull/3).


    | | |

    |--|--|

    | **Actions** | [30574256524](https://github.com/Mr-Ashish/odoo/actions/runs/30574256524) |

    | **Session** | `20260730_191954_63f003` |

    | **Model** | `anthropic/claude-opus-5` via OpenRouter |

    | **Loop** | **10 API calls** · **9 tool-call turns** · **26 messages** · ~251s Hermes |

    | **Tokens** | ~195k total (cache-heavy) · est. **$0.59** |

    | **Verdict** | REQUEST CHANGES · **Score** 42/100 · effort 4/5 |

    | **Package** |
    [`docs/showcase/e2e-odoo-pr3-opus5-agentic-loop/`](docs/showcase/e2e-odoo-pr3-opus5-agentic-loop/) |


    ### High-level e2e agentic loop (this trace)


    Mermaid below is **not a sketch** — nodes match the live session: outer Actions control plane, then Hermes
    multi-turn tool loop (read diff → codec repros → call-site grep → surrogatepass vs surrogateescape → final
    review).


    ```mermaid

    %% Live e2e · Mr-Ashish/odoo#3 · run 30574256524 · anthropic/claude-opus-5

    %% Session 20260730_191954_63f003 · 10 API calls · 9 tool-call turns · 26 messages

    flowchart TB
      subgraph Outer["Outer control plane · GitHub Actions"]
        T["@luffy review this pr"]
        Gate["Gate · association"]
        Sparse["Sparse checkout · PR head"]
        Pre["preload hub MEMORY"]
        Asm["assemble prompt + diff"]
        Post["PR comment · artifacts · hub memory"]
      end

      subgraph Loop["Hermes agentic loop · real trace"]
        direction TB
        U0["① USER prompt<br/>SOUL + contract + PR #3 meta"]
        A1["② ASSISTANT + tools<br/>cat pr.diff · cat context.md"]
        A2["③ tools · repro<br/>latin-1 café + read xml_utils.py"]
        A3["④ tools · call sites<br/>grep remove_control_characters"]
        A4["⑤ tools · cleanup_xml_node<br/>+ more codec experiments"]
        A5["⑥–⑨ tools · surrogatepass vs<br/>surrogateescape · EDI payload"]
        A6["⑩ tools · callers of cleanup_xml_node<br/>+ final local repro"]
        Out["⑪ FINAL review Markdown<br/>Verdict REQUEST CHANGES · Score 42/100"]
        OR["OpenRouter · anthropic/claude-opus-5"]

        U0 --> A1 --> A2 --> A3 --> A4 --> A5 --> A6 --> Out
        A1 & A2 & A3 & A4 & A5 & A6 <--> OR
      end

      T --> Gate --> Sparse --> Pre --> Asm --> U0
      Out --> Post

      classDef tool fill:#1f2937,stroke:#FF6B2C,color:#fff
      classDef model fill:#0B0F19,stroke:#FFD166,color:#FFD166
      classDef ship fill:#14532d,stroke:#22c55e,color:#fff
      class A1,A2,A3,A4,A5,A6 tool
      class OR,Out model
      class Post ship
    ```


    **What the agent actually did (condensed from the trace)**


    | Turn | Kind | What happened |

    |------|------|----------------|

    | 1 | user | Full Luffy review prompt + PR #3 meta |

    | 2 | tools | `cat pr.diff`, `cat context.md` |

    | 3 | tools | Latin-1 `café` repro + read `xml_utils.py` |

    | 4 | tools | `grep remove_control_characters` call sites |

    | 5–8 | tools | More codec / `cleanup_xml_node` experiments |

    | 9 | tools | Callers of `cleanup_xml_node` + final repro |

    | 10 | assistant | Structured review → REQUEST CHANGES (surrogatepass bug) |


    Full step dump (every tool arg + message):
    [`agent-loop/agent-loop.md`](docs/showcase/e2e-odoo-pr3-opus5-agentic-loop/agent-loop/agent-loop.md) ·
    JSON:
    [`agent-loop/agent-loop.json`](docs/showcase/e2e-odoo-pr3-opus5-agentic-loop/agent-loop/agent-loop.json)


    ```bash

    gh run download 30574256524 -R Mr-Ashish/odoo -n luffy-trace-pr3-run30574256524

    ```
  agentic_loop_title: Agentic loop (example)
  agentic_loop_intro: "End-to-end control plane for one review: comment trigger → Actions gate → orchestrator
    stages → Hermes multi-turn agentic loop (tools + OpenRouter · Claude Opus 5) → normalize → memory + full
    step trace → PR comment. Live package: docs/showcase/e2e-odoo-pr3-opus5-agentic-loop/."
  agentic_loop_ascii: diagrams/agentic-loop-ascii.txt
  agentic_loop_mermaid: diagrams/agentic-loop.mmd
  agentic_loop_note: "Inner loop: Hermes may call tools (read workspace files) before emitting the final
    Markdown review. Outer loop is deterministic shell orchestration so every run leaves a redacted trace
    under `.luffy-out/traces/` and hub memory under `memory/repos/`."
output:
  readme: README.md
  branding_dir: branding
