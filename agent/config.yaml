# Hermes Agent config for Luffy PR reviews (CI / local).
# Secrets: HERMES_HOME/.env or process env OPENROUTER_API_KEY.

model:
  provider: openrouter
  # Override with LUFFY_MODEL / OPENROUTER_MODEL (default: Claude Opus 5).
  default: anthropic/claude-opus-5

terminal:
  backend: local

# Verbose agent/tool logging → HERMES_HOME/logs/agent.log
display:
  tool_progress: verbose

# Memory lives under HERMES_HOME/memories — preloaded from hub when available.
